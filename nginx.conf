server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    # Jekyll writes posts as /YYYY/MM/DD/slug.html; also serve them without
    # the .html so /YYYY/MM/DD/slug works.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
