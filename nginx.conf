# Assets and fonts are linked with ?v=<build time> (see _layouts/default.html),
# so a versioned URL never changes and can be cached for a year. The same file
# requested without ?v= is revalidated instead, so it can't go stale.
map $arg_v $asset_cache_control {
    ""       "no-cache";
    default  "public, max-age=31536000, immutable";
}

server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip         on;
    gzip_types   text/css application/javascript text/xml application/xml image/svg+xml;

    location ~ ^/(fonts|assets)/ {
        add_header Cache-Control $asset_cache_control;
    }

    # Pages, the feed and images keep their URLs across deploys: browsers
    # revalidate them on every visit (a cheap 304 when nothing changed).
    location /images/ {
        add_header Cache-Control "no-cache";
    }

    # Jekyll writes posts as /YYYY/MM/DD/slug.html; also serve them without
    # the .html so /YYYY/MM/DD/slug works.
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
