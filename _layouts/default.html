<!DOCTYPE html>{% comment %} Bumped on every build so browsers fetch new asset URLs after a deploy; see nginx.conf. {% endcomment %}{% assign asset_version = site.time | date: '%s' %}
<html>
  <head>
    <title>Tinco.nl</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" type="text/css" href="/assets/tinco.css?v={{ asset_version }}" />
    <link rel="preload" href="/fonts/roboto-slab-latin.woff2?v={{ asset_version }}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/roboto-latin.woff2?v={{ asset_version }}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/ChicagoFLF.woff?v={{ asset_version }}" as="font" type="font/woff" crossorigin>
    <style>
        /* Roboto and Roboto Slab, self-hosted from Google Fonts (latin and
           latin-ext subsets) so pages don't wait on another host. */
        /* Roboto, latin-ext */
        @font-face {
          font-family: 'Roboto';
          font-style: normal;
          font-weight: 300 700;
          font-stretch: 100%;
          font-display: swap;
          src: url(/fonts/roboto-latin-ext.woff2?v={{ asset_version }}) format('woff2');
          unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
        }
        /* Roboto, latin */
        @font-face {
          font-family: 'Roboto';
          font-style: normal;
          font-weight: 300 700;
          font-stretch: 100%;
          font-display: swap;
          src: url(/fonts/roboto-latin.woff2?v={{ asset_version }}) format('woff2');
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        /* Roboto Slab, latin-ext */
        @font-face {
          font-family: 'Roboto Slab';
          font-style: normal;
          font-weight: 300 400;
          font-display: swap;
          src: url(/fonts/roboto-slab-latin-ext.woff2?v={{ asset_version }}) format('woff2');
          unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
        }
        /* Roboto Slab, latin */
        @font-face {
          font-family: 'Roboto Slab';
          font-style: normal;
          font-weight: 300 400;
          font-display: swap;
          src: url(/fonts/roboto-slab-latin.woff2?v={{ asset_version }}) format('woff2');
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }

        @font-face {
            font-family: 'ChicagoFLF';
            src: url('/fonts/ChicagoFLF.woff?v={{ asset_version }}') format('woff');
            font-display: swap;
        }

        :root {
            --bg: #fafafa;
            --text: #2a2a2a;
            --muted: #444444;
            --link: #0b6e99;
            --code-bg: #eeeeee;
            --heading-1: #1a7f99;
            --heading-2: #b86e00;
            --summary: #4d7a00;
            --border: #2a2a2a;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #2a2a2a;
                --text: #f8f8f2;
                --muted: #CECECE;
                --link: lightblue;
                --code-bg: #121212;
                --heading-1: #66d9ef;
                --heading-2: #f6aa11;
                --summary: #a6e22e;
                --border: white;
            }
        }

        body {
            background-color: var(--bg);
            color: var(--text);
        }

        .post h1, .post h3 { color: var(--heading-1); }
        .post h2, .post h4 { color: var(--heading-2); }
        .post .summary { color: var(--summary); }
        #header table td.colored { background-color: var(--text); }

        html {
            font-family: 'Roboto', serif;
            font-size: 100%;
            font-weight: 300;
            line-height: 1.6;
        }

        #header {
            padding: 0em;
            max-width: 100%;
        }

        #header table {
            width: 100%;
        }

        #page {
            width: 100%;
            top: 0;
            padding: 3rem 0 4rem;
        }

        #content {
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            padding: 0 1rem;
            text-align: left;
            overflow-wrap: break-word;
        }

        .post h1 {
            font-size: min(3.5em, 10vw);
        }

        #content h1 {
            text-align: center;
            font-family: 'ChicagoFLF', 'Roboto', sans-serif;
            font-weight: normal;
            text-transform: none;
            letter-spacing: 0;
        }

        .post p, p, ul, ol {
            font-family: 'Roboto Slab', serif;
            font-size: 1.125rem;
            font-weight: 350;
            line-height: 1.7;
            text-wrap: pretty;
            padding-top: 0em;
            padding-bottom: 0.6em;
            color: var(--muted);
        }

        h1,h2,h3,h4,h5 {
            text-transform: uppercase;
            font-family: 'Roboto', sans-serif;
            font-weight: 400;
            letter-spacing: 2px;
            line-height: 1.2;
            text-wrap: balance;
            padding: .5em;
        }

        a {
          color: var(--link);
          text-decoration: none;
        }

        a:before {
          content: '» ';
        }

        li {
          list-style-type: none;
        }

        .post ol li {
          list-style-type: decimal;
          margin-bottom: 0.4em;
        }

        pre, code {
           background-color: var(--code-bg);
        }

        pre {
           padding: 1em;
        }

        .mini-bio {
          display: block;
          text-align: center;
          max-width: 600px;
          margin-left: auto;
          margin-right: auto;
        }

        .mini-bio img {
          width: 150px;
          height: 150px;
          border-radius: 50%; /*don't forget prefixes*/
          border: 3px solid var(--border);
        }

        .mini-bio .avatar:before {
          content: '';
        }

        figure.diagram {
          margin: 2.5em 0 3em;
        }

        figure.diagram svg.pele {
          display: block;
          margin: 0 auto;
        }

        figure.diagram figcaption {
          font-family: 'Roboto Slab', serif;
          font-size: 0.9em;
          font-style: italic;
          text-align: center;
          color: var(--muted);
          margin-top: 0.5em;
        }

        /* E-mail signup form, see _layouts/post.html */
        form.signup {
          margin: 3em 0 1em;
          text-align: center;
        }

        .signup-row {
          display: flex;
          gap: 0.5em;
          max-width: 28rem;
          margin: 0 auto;
        }

        .signup-row input {
          flex: 1;
          min-width: 0;
          padding: 0.6em 0.8em;
          border: 1px solid var(--heading-1);
          border-radius: 8px;
          background-color: var(--code-bg);
          color: var(--text);
          font-family: 'Roboto Slab', serif;
          font-size: 1rem;
        }

        .signup-row button {
          padding: 0.6em 1.2em;
          border: 0;
          border-radius: 8px;
          background-color: var(--heading-1);
          color: var(--bg);
          font-family: 'Roboto', sans-serif;
          font-size: 1rem;
          font-weight: 700;
          cursor: pointer;
        }

        .signup-row button:disabled {
          opacity: 0.6;
          cursor: default;
        }

        p.signup-message {
          min-height: 1.7em;
          margin-top: 0.5em;
          font-size: 1rem;
          text-align: center;
        }

        p.signup-message.signup-error {
          color: var(--heading-2);
        }

        /* Static tweet cards, see _includes/tweet.html */
        figure.tweet {
          max-width: 500px;
          margin: 2.5em auto 3em;
          padding: 1em 1.25em;
          border: 1px solid var(--heading-1);
          border-radius: 12px;
          background-color: var(--code-bg);
          font-family: 'Roboto', sans-serif;
          font-size: 1.0625rem;
          font-weight: 400;
          line-height: 1.45;
          color: var(--text);
        }

        figure.tweet a:before,
        a.link-card:before {
          content: none;
        }

        figure.tweet header {
          display: flex;
          align-items: flex-start;
          justify-content: space-between;
        }

        figure.tweet .tweet-author {
          display: grid;
          grid-template-columns: 40px auto;
          column-gap: 0.6em;
          align-items: center;
          color: var(--text);
        }

        figure.tweet .tweet-author img {
          grid-row: span 2;
          border-radius: 50%;
        }

        figure.tweet .tweet-name {
          font-weight: 700;
          line-height: 1.2;
        }

        figure.tweet .tweet-handle {
          color: var(--muted);
          font-size: 0.9em;
          line-height: 1.2;
        }

        figure.tweet .tweet-logo {
          color: var(--text);
        }

        figure.tweet .tweet-text {
          font-family: inherit;
          font-size: inherit;
          font-weight: inherit;
          line-height: inherit;
          color: inherit;
          margin: 0.75em 0;
          padding: 0;
        }

        figure.tweet .tweet-media {
          display: block;
          width: 100%;
          height: auto;
          border-radius: 12px;
          margin: 0.75em 0;
          background-color: var(--bg);
        }

        figure.tweet footer {
          font-size: 0.9em;
        }

        figure.tweet footer a {
          color: var(--muted);
        }

        a.link-card {
          display: block;
          max-width: 500px;
          margin: 2.5em auto 3em;
          padding: 1em 1.25em;
          border: 1px solid var(--heading-1);
          border-radius: 12px;
          background-color: var(--code-bg);
          font-family: 'Roboto Slab', serif;
          font-size: 1.125rem;
          line-height: 1.5;
        }

        a.link-card .site {
          display: block;
          font-size: 0.85em;
          color: var(--muted);
        }

        a.link-card .title {
          display: block;
          font-size: 1.15em;
          color: var(--link);
          margin: 0.2em 0;
        }

        a.link-card .description {
          display: block;
          color: var(--text);
        }

        .diagram {
          --pele-bg: var(--bg);
          --pele-fg: var(--text);
          --pele-muted: var(--muted);
          --pele-line: var(--muted);
          --pele-surface: var(--code-bg);
          --pele-surface-alt: var(--code-bg);
          --pele-border: var(--heading-1);
          --pele-accent: var(--link);
          --pele-font: 'Roboto Slab', serif;
        }
    </style>
  </head>
  <body>
    <div id="page">
      <div id="content">
        <div id="header">
          <h1></h1>
        </div>
        {{ content }}

      </div>

      <div id="footer">&nbsp;</div>
    </div>
    <script src="/assets/tinco.js?v={{ asset_version }}"></script>
    {% if content contains 'language-mermaid' %}
    <script src="https://cdn.jsdelivr.net/npm/pele@1.6.0/dist/pele.global.js"
            integrity="sha384-4lHoXtKDt+x/E+htiTc83bpFWyREQzJCMudNQHirqKiCTW7Mx790I/5Q7criNZ1G"
            crossorigin="anonymous"></script>
    <script>
      // Render ```mermaid blocks in posts as SVG diagrams, see https://pele.run
      // A `title:` in the Mermaid front matter becomes a caption below the
      // diagram instead of a heading inside it.
      document.querySelectorAll('code.language-mermaid').forEach(function (code) {
        var source = code.textContent;
        var caption = null;
        source = source.replace(/^---\n([\s\S]*?)\n---\n/, function (_, frontMatter) {
          var rest = frontMatter.replace(/^title:\s*(.*)$/m, function (_, title) {
            caption = title.trim().replace(/^(["'])(.*)\1$/, '$2');
            return '';
          }).trim();
          return rest ? '---\n' + rest + '\n---\n' : '';
        });

        var figure = document.createElement('figure');
        figure.className = 'diagram';
        var diagram = document.createElement('div');
        figure.appendChild(diagram);
        if (caption) {
          var figcaption = document.createElement('figcaption');
          figcaption.textContent = caption;
          figure.appendChild(figcaption);
        }
        code.parentNode.replaceWith(figure);
        pele.mount(diagram, source, { zoom: false });
      });
    </script>
    {% endif %}
  </body>
</html>
