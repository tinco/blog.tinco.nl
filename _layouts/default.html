<!DOCTYPE html>
<html>
  <head>
    <title>Tinco.nl</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <link href='https://fonts.googleapis.com/css?family=Roboto:300,400,700,900' rel='stylesheet' type='text/css'>
    <link href='https://fonts.googleapis.com/css?family=Roboto+Slab:400,300' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" type="text/css" href="https://tinco.nl/tinco.css" />
    <style>
        :root {
            --bg: #fafafa;
            --text: #2a2a2a;
            --muted: #444444;
            --link: #0b6e99;
            --code-bg: #eeeeee;
            --heading-1: #1a7f99;
            --heading-2: #b86e00;
            --summary: #4d7a00;
            --border: #2a2a2a;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #2a2a2a;
                --text: #f8f8f2;
                --muted: #CECECE;
                --link: lightblue;
                --code-bg: #121212;
                --heading-1: #66d9ef;
                --heading-2: #f6aa11;
                --summary: #a6e22e;
                --border: white;
            }
        }

        body {
            background-color: var(--bg);
            color: var(--text);
        }

        .post h1, .post h3 { color: var(--heading-1); }
        .post h2, .post h4 { color: var(--heading-2); }
        .post .summary { color: var(--summary); }
        #header table td.colored { background-color: var(--text); }

        html {
            font-family: 'Roboto', serif;
            font-size: 1.1em;
            font-weight: 300;
            line-height: 1.6;
        }

        #header {
            padding: 0em;
        }

        #content {
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            text-align: left;
        }

        #content h1 {
            text-align: center;
        }

        .post p, p ,ul {
            font-family: 'Roboto Slab', serif;
            padding-top: 0em;
            padding-bottom: 0.6em;
            color: var(--muted);
        }

        h1,h2,h3,h4,h5 {
            text-transform: uppercase;
            font-family: 'Roboto', sans-serif;
            font-weight: 400;
            letter-spacing: 2px;
            padding: .5em;
        }

        a {
          color: var(--link);
          text-decoration: none;
        }

        a:before {
          content: '» ';
        }

        li {
          list-style-type: none;
        }

        pre, code {
           background-color: var(--code-bg);
        }

        pre {
           padding: 1em;
        }

        .mini-bio {
          display: block;
          text-align: center;
          max-width: 600px;
          margin-left: auto;
          margin-right: auto;
        }

        .mini-bio img {
          width: 150px;
          height: 150px;
          border-radius: 50%; /*don't forget prefixes*/
          border: 3px solid var(--border);
        }

        .mini-bio .avatar:before {
          content: '';
        }
    </style>
  </head>
  <body>
    <div id="page">
      <div id="content">
        <div id="header">
          <h1></h1>
        </div>
        {{ content }}

      </div>

      <div id="footer">&nbsp;</div>
    </div>
    <script src="https://tinco.nl/tinco.js"></script>
    <script type="text/javascript">
      var _gaq = _gaq || [];
      _gaq.push(['_setAccount', 'UA-15636910-1']);
      _gaq.push(['_setDomainName', '.tinco.nl']);
      _gaq.push(['_trackPageview']);

      (function() {
       var ga = document.createElement('script'); ga.type = 'text/javascript'; ga.async = true;
       ga.src = ('https:' == document.location.protocol ? 'https://ssl' : 'http://www') + '.google-analytics.com/ga.js';
       var s = document.getElementsByTagName('script')[0]; s.parentNode.insertBefore(ga, s);
       })();
    </script>
  </body>
</html>
