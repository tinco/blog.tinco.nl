<!-- Email signup, handled by Loops (app.loops.so → Forms) -->
<form class="signup" action="https://app.loops.so/api/newsletter-form/cmvkzwukk0prg0jzttguo2lx1" method="post">
  <h4><label for="signup-email">Like this blog? Sign up for e-mail notifications:</label></h4>
  <input type="hidden" name="source" value="blog.tinco.nl">
  <div class="signup-row">
    <input type="email" id="signup-email" name="email" placeholder="you@example.com" autocomplete="email" required>
    <button type="submit">Subscribe</button>
  </div>
  <p class="signup-message" role="status" aria-live="polite"></p>
</form>
<script>
  document.querySelectorAll('form.signup').forEach(function (form) {
    var message = form.querySelector('.signup-message');
    var button = form.querySelector('button');

    function show(text, isError) {
      message.textContent = text;
      message.classList.toggle('signup-error', !!isError);
    }

    form.addEventListener('submit', function (event) {
      event.preventDefault();

      // Loops rate limits signups per IP; avoid repeat submits from one browser.
      var now = Date.now();
      var last = 0;
      try { last = Number(localStorage.getItem('loops-form-timestamp')) || 0; } catch (e) {}
      if (now - last < 60000) {
        show('Too many signups, please try again in a minute.', true);
        return;
      }
      try { localStorage.setItem('loops-form-timestamp', String(now)); } catch (e) {}

      button.disabled = true;
      show('Signing you up…');
      fetch(form.action, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams(new FormData(form)).toString()
      })
        .then(function (response) {
          if (response.status === 429) throw new Error('Too many signups, please try again in a minute.');
          return response.json().then(function (data) {
            if (!response.ok || !data.success) throw new Error(data.message || 'Something went wrong, please try again.');
          });
        })
        .then(function () {
          form.reset();
          show('Thanks! You\u2019ll get an e-mail when there\u2019s a new post.');
        })
        .catch(function (error) {
          try { localStorage.removeItem('loops-form-timestamp'); } catch (e) {}
          show(error.message === 'Failed to fetch' ? 'Something went wrong, please try again later.' : error.message, true);
        })
        .finally(function () {
          button.disabled = false;
        });
    });
  });
</script>
